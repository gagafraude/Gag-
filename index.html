<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>Come Caca</title>

<style>

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;

  background: #a9a9a9;

  font-family: Arial, sans-serif;

  user-select: none;
  touch-action: none;
}


/* =========================================================
   HUD
   ========================================================= */

#hud {

  position: fixed;

  top: 0;
  left: 0;

  width: 100%;

  height: 40px;

  z-index: 50;

  display: flex;

  align-items: center;
  justify-content: center;

  pointer-events: none;
}


/* =========================================================
   BARRA DE PROGRESO
   ========================================================= */

#barraProgresoContenedor {

  position: absolute;

  left: 16px;
  right: 16px;

  top: 7px;

  height: 26px;

  background: rgba(0, 0, 0, 0.35);

  border: 2px solid rgba(255,255,255,0.8);

  border-radius: 14px;

  overflow: hidden;

  box-shadow:
    0 2px 5px rgba(0,0,0,0.35);
}


#barraProgreso {

  width: 0%;

  height: 100%;

  background: #24d83d;

  border-radius: 11px;

  transition:
    width 0.18s ease-out;

  box-shadow:
    inset 0 2px 2px rgba(255,255,255,0.35);

}


/* =========================================================
   CONTADOR 1-5
   ========================================================= */

#contadorCacas {

  position: fixed;

  top: 39px;

  left: 50%;

  transform: translateX(-50%);

  z-index: 60;

  min-width: 32px;

  padding: 3px 9px;

  text-align: center;

  font-size: 20px;

  font-weight: bold;

  color: #222;

  background:
    rgba(255,255,255,0.72);

  border-radius: 8px;

  pointer-events: none;
}


/* =========================================================
   CANVAS
   ========================================================= */

#juego {

  position: fixed;

  top: 0;
  left: 0;

  display: block;

  width: 100vw;
  height: 100vh;

  touch-action: none;
}


/* =========================================================
   D-PAD
   ========================================================= */

#dpad {

  position: fixed;

  right: 16px;
  bottom: 22px;

  width: 170px;
  height: 170px;

  display: grid;

  grid-template-columns:
    1fr 1fr 1fr;

  grid-template-rows:
    1fr 1fr 1fr;

  grid-template-areas:

    ". arriba ."

    "izquierda centro derecha"

    ". abajo .";

  gap: 5px;

  z-index: 80;
}


.btn-dir {

  border: none;

  border-radius: 12px;

  background:
    rgba(0,0,0,0.40);

  color: white;

  font-size: 24px;

  font-weight: bold;

  touch-action: none;

  user-select: none;

  cursor: pointer;
}


.btn-dir:active {

  background:
    rgba(0,0,0,0.70);

  transform:
    scale(0.95);
}


.btn-dir[data-dir="arriba"] {
  grid-area: arriba;
}


.btn-dir[data-dir="abajo"] {
  grid-area: abajo;
}


.btn-dir[data-dir="izquierda"] {
  grid-area: izquierda;
}


.btn-dir[data-dir="derecha"] {
  grid-area: derecha;
}


/* =========================================================
   OVERLAYS
   ========================================================= */

.overlay {

  position: fixed;

  inset: 0;

  z-index: 100;

  background: #000;

  display: flex;

  flex-direction: column;

  align-items: center;
  justify-content: center;
}


.overlay.oculto {
  display: none;
}


.overlay img,
.overlay video {

  width: 100%;
  height: 100%;

  object-fit: contain;

  background: #000;
}


.acciones {

  position: absolute;

  bottom: 25px;

  left: 0;
  right: 0;

  display: flex;

  justify-content: center;
}


.boton {

  padding:
    14px 35px;

  border: none;

  border-radius: 10px;

  background:
    #c0392b;

  color: white;

  font-size: 20px;

  font-weight: bold;

  cursor: pointer;
}


.boton:active {

  transform:
    scale(0.95);
}

</style>
</head>

<script>

/* =========================================================
   CONFIGURACIÓN

const COLS = 10;

const ROWS = 16;


const COLOR_FONDO = '#a9a9a9';

const COLOR_PARED = '#3a3a3a';


const VEL_JUGADOR = 1.5;

const VEL_ENEMIGO = 0.8;


const ESCALA_PERSONAJE = 2.5;

const ENEMIGOS_INI = 4;

const VIDAS_INI = 3;


const PUNTOS_CACA = 10;


/*
   Cada 5 cacas dispara un evento.

/* =========================================================
   CENTRO
   ========================================================= */

const CENTRO = {

  c1: 3,
  c2: 6,

  r1: 6,
  r2: 9
};


const ASPECTO_CENTRO =
  1920 / 1080;


const CENTRO_IMPACTO_ESCALA =

const CENTRO_IMPACTO_DURACION =
  220;


let centroImpactoInicio = 0;

   CANVAS
   ========================================================= */

const canvas =
  document.getElementById(
    'juego'
  );


const ctx =
  canvas.getContext(
    '2d'
  );


let CELL = 0;

let OFFSET_X = 0;

let OFFSET_Y = 0;


function ajustarCanvas() {

  const w =
    window.innerWidth;


  const h =
    window.innerHeight;


  canvas.width = w;

  canvas.height = h;


  const cellW =
    w / COLS;


  const cellH =
    (h - 40) / ROWS;


  CELL =
    Math.floor(
      Math.min(
        cellW,
        cellH
      )
    );


  OFFSET_X =
    Math.floor(
      (w -
        CELL * COLS) / 2
    );


  OFFSET_Y =
    Math.floor(
      (
        h -
        CELL * ROWS
      ) / 2
    );
}


window.addEventListener(
  'resize',
  ajustarCanvas
);

const imgBillete =

imgBillete.src =
  'assets/billete.png';


const BILLETE_DURACION_MS =
  2000;


const BILLETE_FRAMES =
  16;


const BILLETE_LOOPS =
  6;


const BILLETE_COLUMNAS =
  4;


const BILLETE_FILAS =
  4;


const BILLETE_ANCHO =
  130;


const BILLETE_ALTO =
  BILLETE_ANCHO *
  (410 / 360);


const billetesVolando = [];


function lanzarBillete() {

  const audio =
    new Audio(
      'assets/billete.mp3'
    );


  audio.volume = 1;


  const billete = {

    inicio:
      performance.now(),

    duracion:
      BILLETE_DURACION_MS,

    audio,

    frame: 0
  };


  billetesVolando.push(
    billete
  );


  audio.play()
    .catch(() => {});
}


function actualizarBilletes(
  ahora
) {

  for (
    let i =
      billetesVolando.length - 1;

    i >= 0;

    i--
  ) {

    const b =
      billetesVolando[i];


    const progreso =
      Math.min(
        1,

        Math.max(
          0,

          (
            ahora -
            b.inicio
          ) /
          b.duracion
        )
      );


    const totalFrames =
      BILLETE_FRAMES *
      BILLETE_LOOPS;


    const frameTotal =
      Math.min(

        totalFrames - 1,

        Math.floor(
          progreso *
          totalFrames
        )
      );


    b.frame =
      frameTotal %
      BILLETE_FRAMES;


    if (
      progreso >= 1
    ) {

      b.audio.pause();

      b.audio.currentTime =
        0;


      billetesVolando.splice(
        i,
        1
      );
    }
  }
}


function dibujarBilletes() {

  if (
    !imgBillete.complete ||
    imgBillete.naturalWidth <= 0
  ) return;


  const sw =
    imgBillete.width /
    BILLETE_COLUMNAS;


  const sh =
    imgBillete.height /
    BILLETE_FILAS;


  for (
    const b of billetesVolando
  ) {

    const progreso =
      Math.min(

        1,

        Math.max(

          0,

          (
            performance.now() -
            b.inicio
          ) /
          b.duracion
        )
      );


    const inicioX =
      -BILLETE_ANCHO / 2;


    const inicioY =
      canvas.height +
      BILLETE_ALTO / 2;


    const finalX =
      canvas.width +
      BILLETE_ANCHO / 2;


    const finalY =
      -BILLETE_ALTO / 2;


    const x =
      inicioX +
      (
        finalX -
        inicioX
      ) *
      progreso;


    const y =
      inicioY +
      (
        finalY -
        inicioY
      ) *
      progreso;


    const columna =
      b.frame %
      BILLETE_COLUMNAS;


    const fila =
      Math.floor(
        b.frame /
        BILLETE_COLUMNAS
      );


    const sx =
      columna * sw;


    const sy =
      fila * sh;


    ctx.drawImage(

      imgBillete,

      sx,
      sy,

      sw,
      sh,

      x -
        BILLETE_ANCHO / 2,

      y -
        BILLETE_ALTO / 2,

      BILLETE_ANCHO,

      BILLETE_ALTO
    );
  }
}

/* =========================================================

let jugador;

      'barraProgreso'
    );


  if (
    !barra
  ) return;


  if (
    cacasTotalesNivel <= 0
  ) {

    barra.style.width =
      '0%';

    return;
  }


  const porcentaje =
    (
      cacasComidasNivel /
      cacasTotalesNivel
    ) *
    100;


  const porcentajeSeguro =
    Math.max(
      0,

      Math.min(

      )
    );

    porcentajeSeguro + '%';

/* =========================================================
   ANIMACIÓN
   ========================================================= */

let frameJugador = 0;

let frameEnemigo = 0;

let ultimoFrameMs = 0;

let ultimoMs = 0;

let pasoAcumulado = 0;


/* =========================================================
   UTILIDADES
   ========================================================= */

function esCentro(
  col,
  fila
) {

  return (

    col >= CENTRO.c1 &&

    col <= CENTRO.c2 &&

    fila >= CENTRO.r1 &&

    fila <= CENTRO.r2
  );
}


function esBorde(
  col,
  fila
) {

  return (

    col === 0 ||

    col === COLS - 1 ||

    fila === 0 ||

    fila === ROWS - 1
  );
}


function esBloque(
  col,
  fila
) {

  return (

    esBorde(
      col,
      fila
    ) ||

    esCentro(
      col,
      fila
    )
  );
}


function celdaLibre(
  col,
  fila
) {

  return !esBloque(
    col,
    fila
  );
}


function centroCelda(
  col,
  fila
) {

  return {

    x:
      OFFSET_X +
      (col + 0.5) *
      CELL,

    y:
      OFFSET_Y +
      (fila + 0.5) *
      CELL
  };
}


function celdaDePixel(
  px,
  py
) {

  return {

    col:
      Math.floor(
        (
          px -
          OFFSET_X
        ) /
        CELL
      ),

    fila:
      Math.floor(
        (
          py -
          OFFSET_Y
        ) /
        CELL
      )
  };
}


function rectCentro() {

  const zonaX =
    OFFSET_X +
    CENTRO.c1 *
    CELL;


  const zonaY =
    OFFSET_Y +
    CENTRO.r1 *
    CELL;


  const zonaW =
    (
      CENTRO.c2 -
      CENTRO.c1 +
      1
    ) *
    CELL;


  const zonaH =
    (
      CENTRO.r2 -
      CENTRO.r1 +
      1
    ) *
    CELL;


  let w =
    zonaW;


  let h =
    w /
    ASPECTO_CENTRO;


  if (
    h > zonaH
  ) {

    h =
      zonaH;


    w =
      h *
      ASPECTO_CENTRO;
  }


  return {

    x:
      zonaX +
      (
        zonaW -
        w
      ) / 2,

    y:
      zonaY +
      (
        zonaH -
        h
      ) / 2,

    w,

    h
  };
}

   EVENTO

  if (
    !eventosCaca.length
  ) return;


  if (
    !eventosDisponibles.length
  ) {

    mezclarEventos();
  }


  const indice =
    eventosDisponibles.pop();


  ultimoEvento =
    indice;


  const evento =
    eventosCaca[indice];


  eventoCentroActivo =
    evento;


  if (
    audioEventoActivo
  ) {

    audioEventoActivo.pause();

    audioEventoActivo.currentTime =
      0;
  }


  audioEventoActivo =
    evento.audioObj;


  videoCentro.pause();


  audioEventoActivo.currentTime =
    0;


  audioEventoActivo.play()
    .catch(() => {});


  audioEventoActivo.onended =
    () => {

      if (
        audioEventoActivo ===
        evento.audioObj
      ) {

        eventoCentroActivo =
          null;


        videoCentro.play()
          .catch(() => {});
      }
    };
}


/* =========================================================
   INICIALIZAR
   ========================================================= */

function inicializar() {

  ajustarCanvas();


  const p0 =
    centroCelda(
      Math.floor(
        COLS / 2
      ),
      ROWS - 3
    );


  jugador = {

    x: p0.x,

    y: p0.y,

    dir: 'arriba',

    vel:
      VEL_JUGADOR,

    vivo: true
  };


  cacas = [];


  /*
     CREAR CACAS
  */

  for (
    let f = 0;
    f < ROWS;
    f++
  ) {

    for (
      let c = 0;
      c < COLS;
      c++
    ) {

      if (
        !celdaLibre(
          c,
          f
        )
      ) continue;


      if (

        c ===
        Math.floor(
          COLS / 2
        ) &&

        f === ROWS - 3

      ) continue;


      if (
        Math.random() <
        PROB_CACA
      ) {

        const p =
          centroCelda(
            c,
            f
          );


        cacas.push({

          x: p.x,

          y: p.y,

          comida: false
        });
      }
    }
  }


  /*
     ================================================
     NUEVO NIVEL

     Guardamos cuántas cacas existen
     en total.
     ================================================
  */

  cacasTotalesNivel =
    cacas.length;


  cacasComidasNivel =
    0;


  actualizarBarraProgreso();


  /* =====================================================
     CARAS
     ===================================================== */

  caras = [];


  let intentos = 0;


  while (

    caras.length <
      NUM_CARAS &&

    intentos < 500

  ) {

    intentos++;


    const c =
      1 +
      Math.floor(
        Math.random() *
        (COLS - 2)
      );


    const f =
      1 +
      Math.floor(
        Math.random() *
        (ROWS - 2)
      );


    if (
      !celdaLibre(
        c,
        f
      )
    ) continue;


    const p =
      centroCelda(
        c,
        f
      );


    if (

      Math.hypot(

        p.x -
        jugador.x,

        p.y -
        jugador.y

      ) <

      CELL * 3

    ) continue;


    caras.push({

      x: p.x,

      y: p.y,

      recogida: false
    });
  }


  /* =====================================================
     ENEMIGOS
     ===================================================== */

  enemigos = [];


  const esquinas = [

    centroCelda(
      1,
      1
    ),

    centroCelda(
      COLS - 2,
      1
    ),

    centroCelda(
      1,
      ROWS - 2
    ),

    centroCelda(
      COLS - 2,
      ROWS - 2
    )

  ];


  for (
    let i = 0;
    i < ENEMIGOS_INI;
    i++
  ) {

    enemigos.push({

      x:
        esquinas[i].x,

      y:
        esquinas[i].y,

      dir:
        'abajo',

      vel:
        VEL_ENEMIGO
    });
  }


  puntos = 0;

  vidas =
    VIDAS_INI;


  paralizadoHasta =
    0;


  ultimoEnemigo =
    performance.now();


  juegoActivo =
    true;


  pasoAcumulado =
    0;


  /*
     El contador de eventos
     vuelve a cero.
  */

  cacasComidasDesdeEvento =
    0;


  actualizarContadorCacas();


  centroImpactoInicio =
    0;


  ultimoEvento =
    -1;


  eventosDisponibles =
    [];


  mezclarEventos();


  billetesVolando.length =
    0;


  eventoCentroActivo =
    null;


  if (
    audioEventoActivo
  ) {

    audioEventoActivo.pause();

    audioEventoActivo.currentTime =
      0;

    audioEventoActivo =
      null;
  }


  videoCentro.currentTime =
    0;


  videoCentro.play()
    .catch(() => {});


  document
    .getElementById(
      'derrota'
    )
    .classList.add(
      'oculto'
    );


  document
    .getElementById(
      'victoria'
    )
    .classList.add(
      'oculto'
    );


  audioMusica.currentTime =
    0;


  audioMusica.play()
    .catch(() => {});
}


/* =========================================================
   ENEMIGO NUEVO

function agregarEnemigoAleatorio() {

  const candidatos = [];


  for (
    let c = 1;
    c < COLS - 1;
    c++
  ) {

    for (
      let f = 1;
      f < ROWS - 1;
      f++
    ) {

      if (
        celdaLibre(
          c,
          f
        )
      ) {

        candidatos.push({

          c,

          f
        });
      }
    }
  }


  if (
    !candidatos.length
  ) return;


  const e =
    candidatos[
      Math.floor(
        Math.random() *
        candidatos.length
      )
    ];


  const p =
    centroCelda(
      e.c,
      e.f
    );


  enemigos.push({

    x: p.x,

    y: p.y,

    dir: 'abajo',

    vel:
      VEL_ENEMIGO
  });
}

/* =========================================================
   MOVIMIENTO
   ========================================================= */

function moverEntidad(
  ent,
  dt
) {

  const dx =
    (
      ent.dir ===
      'derecha'

        ? 1

        : ent.dir ===
          'izquierda'

          ? -1

          : 0
    ) *
    ent.vel *
    dt;


  const dy =
    (
      ent.dir ===
      'abajo'

        ? 1

        : ent.dir ===
          'arriba'

          ? -1

          : 0
    ) *
    ent.vel *
    dt;


  if (
    dx !== 0
  ) {

    const nuevaX =
      ent.x + dx;


    const celda =
      celdaDePixel(
        nuevaX,
        ent.y
      );


    if (
      celdaLibre(
        celda.col,
        celda.fila
      )
    ) {

      ent.x =
        nuevaX;

    } else {

      const actual =
        celdaDePixel(
          ent.x,
          ent.y
        );


      ent.x =
        centroCelda(
          actual.col,
          actual.fila
        ).x;
    }
  }


  if (
    dy !== 0
  ) {

    const nuevaY =
      ent.y + dy;


    const celda =
      celdaDePixel(
        ent.x,
        nuevaY
      );


    if (
      celdaLibre(
        celda.col,
        celda.fila
      )
    ) {

      ent.y =
        nuevaY;

    } else {

      const actual =
        celdaDePixel(
          ent.x,
          ent.y
        );


      ent.y =
        centroCelda(
          actual.col,
          actual.fila
        ).y;
    }
  }
}


/* =========================================================
   IA ENEMIGOS
   ========================================================= */

function moverEnemigoIA(
  en,
  dt
) {

  const celda =
    celdaDePixel(
      en.x,
      en.y
    );


  const centro =
    centroCelda(
      celda.col,
      celda.fila
    );


  const cercaX =
    Math.abs(
      en.x -
      centro.x
    ) < 2;


  const cercaY =
    Math.abs(
      en.y -
      centro.y
    ) < 2;


  if (
    cercaX &&
    cercaY
  ) {

    const dx =
      jugador.x -
      en.x;


    const dy =
      jugador.y -
      en.y;


    const opciones = [];


    if (
      Math.abs(dx) >
      Math.abs(dy)
    ) {

      opciones.push(

        dx > 0
          ? 'derecha'
          : 'izquierda'
      );


      opciones.push(

        dy > 0
          ? 'abajo'
          : 'arriba'
      );

    } else {

      opciones.push(

        dy > 0
          ? 'abajo'
          : 'arriba'
      );


      opciones.push(

        dx > 0
          ? 'derecha'
          : 'izquierda'
      );
    }


    const deltas = {

      arriba:
        [0, -1],

      abajo:
        [0, 1],

      izquierda:
        [-1, 0],

      derecha:
        [1, 0]
    };


    for (
      const dir of opciones
    ) {

      const d =
        deltas[dir];


      if (
        celdaLibre(

          celda.col +
          d[0],

          celda.fila +
          d[1]

        )
      ) {

        en.dir =
          dir;

        break;
      }
    }
  }


  moverEntidad(
    en,
    dt
  );
}


/* =========================================================
   ACTUALIZAR
   ========================================================= */

function actualizar(
  dt,
  ahora
) {

  if (
    !juegoActivo
  ) return;


  moverEntidad(
    jugador,
    dt
  );


  pasoAcumulado +=
    jugador.vel *
    dt;


  if (
    pasoAcumulado >=
    CELL * 0.5
  ) {

    pasoAcumulado =
      0;


    reproducirPedo();
  }


  /* =======================================================
     NUEVO ENEMIGO
     ======================================================= */

  if (
    ahora -
    ultimoEnemigo >=
    ENEMIGOS_CADA
  ) {

    ultimoEnemigo =
      ahora;


    agregarEnemigoAleatorio();
  }


  /* =======================================================
     CACAS
     ======================================================= */

  for (
    const c of cacas
  ) {

    if (
      c.comida
    ) continue;


    const distancia =
      Math.hypot(

        c.x -
        jugador.x,

        c.y -
        jugador.y
      );


    if (
      distancia <
      CELL * 0.7
    ) {

      c.comida =
        true;


      puntos +=
        PUNTOS_CACA;


      /*
         =================================================
         BARRA DE PROGRESO

         Aumenta UNA vez por cada
         caca comida.
         =================================================
      */

      cacasComidasNivel++;


      actualizarBarraProgreso();


      /*
         =================================================
         CONTADOR DE EVENTOS

         Este sí vuelve a cero cada 5.
         =================================================
      */

      cacasComidasDesdeEvento++;


      actualizarContadorCacas();


      audioComer.currentTime =
        0;


      audioComer.play()
        .catch(() => {});


      /*
         Evento cada 5.
      */

      if (
        cacasComidasDesdeEvento >=
        CACA_PARA_EVENTO
      ) {

        cacasComidasDesdeEvento =
          0;


        actualizarContadorCacas();


        centroImpactoInicio =
          performance.now();


        mostrarEventoCaca();


        lanzarBillete();
      }
    }
  }


  /* =======================================================
     CARAS
     ======================================================= */

  for (
    const c of caras
  ) {

    if (
      c.recogida
    ) continue;


    if (
      Math.hypot(

        c.x -
        jugador.x,

        c.y -
        jugador.y

      ) <
      CELL * 0.7
    ) {

      c.recogida =
        true;


      paralizadoHasta =
        ahora +
        CARAS_PARALIZA;


      audioCaja.currentTime =
        0;


      audioCaja.play()
        .catch(() => {});
    }
  }


  const paralizado =
    ahora <
    paralizadoHasta;


  if (
    !paralizado
  ) {

    for (
      const enemigo of enemigos
    ) {

      moverEnemigoIA(
        enemigo,
        dt
      );
    }
  }


  /* =======================================================
     COLISIÓN
     ======================================================= */

  for (
    const enemigo of enemigos
  ) {

    if (
      Math.hypot(

        enemigo.x -
        jugador.x,

        enemigo.y -
        jugador.y

      ) <
      CELL * 0.8
    ) {

      perderVida();

      return;
    }
  }


  /* =======================================================
     VICTORIA
     ======================================================= */

  if (

    cacas.length > 0 &&

    cacas.every(
      c => c.comida
    )

  ) {

    ganar();
  }
}


/* =========================================================
   PERDER VIDA
   ========================================================= */

function perderVida() {

  vidas--;


  audioMuerte.currentTime =
    0;


  audioMuerte.play()
    .catch(() => {});


  if (
    vidas <= 0
  ) {

    juegoActivo =
      false;


    audioMusica.pause();


    eventoCentroActivo =
      null;


    if (
      audioEventoActivo
    ) {

      audioEventoActivo.pause();

      audioEventoActivo.currentTime =
        0;

      audioEventoActivo =
        null;
    }


    audioDerrota.currentTime =
      0;


    audioDerrota.play()
      .catch(() => {});


    document
      .getElementById(
        'derrota'
      )
      .classList.remove(
        'oculto'
      );


    return;
  }


  const p =
    centroCelda(

      Math.floor(
        COLS / 2
      ),

      ROWS - 3
    );


  jugador.x =
    p.x;


  jugador.y =
    p.y;


  jugador.dir =
    'arriba';
}


/* =========================================================
   VICTORIA
   ========================================================= */

function ganar() {

  juegoActivo =
    false;


  /*
     Garantiza que la barra
     llegue exactamente al 100%.
  */

  cacasComidasNivel =
    cacasTotalesNivel;


  actualizarBarraProgreso();


  audioMusica.pause();


  if (
    audioEventoActivo
  ) {

    audioEventoActivo.pause();

    audioEventoActivo.currentTime =

    audioEventoActivo =

    );

    )

    );

}


/* =========================================================
   SPRITES
   ========================================================= */

const FILA_DIR = {

  arriba: 0,

  derecha: 1,

  abajo: 2,

  izquierda: 3
};


function obtenerSpriteFantasma(
  dir
) {

  if (
    dir === 'derecha'
  ) {

    return imgFantasmaDerecha;
  }


  if (
    dir === 'izquierda'
  ) {

    return imgFantasmaIzquierda;
  }


  return imgFantasmaCentro;
}


function dibujarSpriteFantasma(
  img,
  ent,
  frame,
  tamano
) {

  if (
    !img.complete ||
    img.naturalWidth <= 0
  ) return;


  const sw =
    img.width /
    FANTASMA_COLUMNAS;


  const sh =
    img.height /
    FANTASMA_FILAS;


  const frameSeguro =
    frame %
    FANTASMA_FRAMES;


  const columna =
    frameSeguro %
    FANTASMA_COLUMNAS;


  const fila =
    Math.floor(
      frameSeguro /
      FANTASMA_COLUMNAS
    );


  ctx.drawImage(

    img,

    columna * sw,

    fila * sh,

    sw,

    sh,

    ent.x -
      tamano / 2,

    ent.y -
      tamano / 2,

    tamano,

    tamano
  );
}


function dibujarSprite(
  img,
  ent,
  dir,
  frame,
  tamano
) {

  if (
    !img.complete ||
    img.naturalWidth <= 0
  ) return;


  const columnas = 4;

  const filas = 4;


  const sw =
    img.width /
    columnas;


  const sh =
    img.height /
    filas;


  const fila =
    FILA_DIR[dir] ?? 2;


  const frameSeguro =
    frame %
    columnas;


  ctx.drawImage(

    img,

    frameSeguro * sw,

    fila * sh,

    sw,

    sh,

    ent.x -
      tamano / 2,

    ent.y -
      tamano / 2,

    tamano,

    tamano
  );
}


/* =========================================================
   DIBUJAR TODO
   ========================================================= */

function dibujar(
  ahora
) {

  /*
     =====================================================
     FONDO REAL DEL JUEGO

     AQUÍ SE UTILIZA fondo.png
     =====================================================
  */

  if (

    imgFondo.complete &&

    imgFondo.naturalWidth > 0

  ) {

    /*
       La imagen ocupa TODO el canvas.
    */

    ctx.drawImage(

      imgFondo,

      0,
      0,

      canvas.width,
      canvas.height
    );

  } else {

    /*
       Solo se utiliza este color como
       respaldo mientras fondo.png
       todavía no terminó de cargar.
    */

    ctx.fillStyle =
      COLOR_FONDO;


    ctx.fillRect(

      0,
      0,

      canvas.width,
      canvas.height
    );
  }


  if (
    !jugador
  ) return;


  /* =====================================================
     BORDE DEL ÁREA DE JUEGO
     ===================================================== */

  ctx.strokeStyle =
    COLOR_PARED;


  ctx.lineWidth =
    Math.max(
      4,
      CELL * 0.15
    );


  ctx.strokeRect(

    OFFSET_X,

    OFFSET_Y,

    CELL * COLS,

    CELL * ROWS
  );


  /* =====================================================
     CENTRO
     ===================================================== */

  const rect =
    rectCentro();


  let escalaCentro =
    1;


  if (
    centroImpactoInicio > 0
  ) {

    const transcurrido =
      ahora -
      centroImpactoInicio;


    if (
      transcurrido <
      CENTRO_IMPACTO_DURACION
    ) {

      const p =
        transcurrido /
        CENTRO_IMPACTO_DURACION;


      if (
        p < 0.22
      ) {

        escalaCentro =
          1 +
          (
            CENTRO_IMPACTO_ESCALA -
            1
          ) *
          (
            p / 0.22
          );

      } else {

        const t =
          (
            p -
            0.22
          ) /
          0.78;


        escalaCentro =
          1 +
          (
            CENTRO_IMPACTO_ESCALA -
            1
          ) *
          (
            1 -
            t * t
          );
      }

    } else {

      centroImpactoInicio =
        0;
    }
  }


  const centroX =
    rect.x +
    rect.w / 2;


  const centroY =
    rect.y +
    rect.h / 2;


  const centroW =
    rect.w *
    escalaCentro;


  const centroH =
    rect.h *
    escalaCentro;


  const centroDrawX =
    centroX -
    centroW / 2;


  const centroDrawY =
    centroY -
    centroH / 2;


  ctx.save();


  if (

    eventoCentroActivo &&

    eventoCentroActivo.img.complete &&

    eventoCentroActivo.img.naturalWidth > 0

  ) {

    ctx.drawImage(

      eventoCentroActivo.img,

      centroDrawX,

      centroDrawY,

      centroW,

      centroH
    );

  } else if (
    videoCentro.readyState >= 2
  ) {

    ctx.drawImage(

      videoCentro,

      centroDrawX,

      centroDrawY,

      centroW,

      centroH
    );

  } else {

    ctx.fillStyle =
      COLOR_PARED;


    ctx.fillRect(

      centroDrawX,

      centroDrawY,

      centroW,

      centroH
    );
  }


  ctx.restore();


  /* =====================================================
     CACAS
     ===================================================== */

  for (
    const caca of cacas
  ) {

    if (
      caca.comida
    ) continue;


    const tamano =
      CELL * 0.9;


    if (

      imgCaca.complete &&

      imgCaca.naturalWidth > 0

    ) {

      ctx.drawImage(

        imgCaca,

        caca.x -
          tamano / 2,

        caca.y -
          tamano / 2,

        tamano,

        tamano
      );

    } else {

      ctx.fillStyle =
        '#6b3e1e';


      ctx.beginPath();


      ctx.arc(

        caca.x,

        caca.y,

        tamano / 2,

        0,

        Math.PI * 2
      );


      ctx.fill();
    }
  }


  /* =====================================================
     CARAS
     ===================================================== */

  for (
    const cara of caras
  ) {

    if (
      cara.recogida
    ) continue;


    const tamano =
      CELL * 1.5;


    if (

      imgCara.complete &&

      imgCara.naturalWidth > 0

    ) {

      ctx.drawImage(

        imgCara,

        cara.x -
          tamano / 2,

        cara.y -
          tamano / 2,

        tamano,

        tamano
      );
    }
  }


  /* =====================================================
     ENEMIGOS
     ===================================================== */

  const tamanoPersonaje =
    CELL *
    ESCALA_PERSONAJE;


  const paralizado =
    ahora <
    paralizadoHasta;


  for (
    const enemigo of enemigos
  ) {

    const img =
      obtenerSpriteFantasma(
        enemigo.dir
      );


    dibujarSpriteFantasma(

      img,

      enemigo,

      frameEnemigo,

      tamanoPersonaje
    );


    if (
      paralizado
    ) {

      ctx.fillStyle =
        'rgba(60,120,255,0.35)';


      ctx.beginPath();


      ctx.arc(

        enemigo.x,

        enemigo.y,

        tamanoPersonaje * 0.45,

        0,

        Math.PI * 2
      );


      ctx.fill();
    }
  }


  /* =====================================================
     JUGADOR
     ===================================================== */

  if (
    jugador.vivo
  ) {

    dibujarSprite(

      imgJugador,

      jugador,

      jugador.dir,

      frameJugador,

      tamanoPersonaje
    );
  }


  /* =====================================================
     BILLETES
     ===================================================== */

  dibujarBilletes();
}


/* =========================================================
   BUCLE PRINCIPAL
   ========================================================= */

function bucle(
  ahora
) {

  const dtSeg =
    Math.min(

      (
        ahora -
        ultimoMs
      ) / 1000,

      0.05
    );


  ultimoMs =
    ahora;


  const dt =
    dtSeg * 60;


  if (
    ahora -
    ultimoFrameMs >
    120
  ) {

    frameJugador =
      (
        frameJugador + 1
      ) % 4;


    frameEnemigo =
      (
        frameEnemigo + 1
      ) %
      FANTASMA_FRAMES;


    ultimoFrameMs =
      ahora;
  }


  actualizar(
    dt,
    ahora
  );


  actualizarBilletes(
    ahora
  );


  dibujar(
    ahora
  );


  requestAnimationFrame(
    bucle
  );
}


/* =========================================================
   REINICIAR
   ========================================================= */

document
  .getElementById(
    'btnReiniciar'
  )
  .addEventListener(
    'click',
    () => {

      audioDerrota.pause();

      audioDerrota.currentTime =
        0;


      inicializar();


      ultimoMs =
        performance.now();
    }
  );


/* =========================================================
   JUGAR OTRA VEZ
   ========================================================= */

document
  .getElementById(
    'btnSiguiente'
  )
  .addEventListener(
    'click',
    () => {

      const video =
        document.getElementById(
          'vidVictoria'
        );


      video.pause();

      video.currentTime =
        0;


      inicializar();


      ultimoMs =
        performance.now();
    }
  );


/* =========================================================
   BOTÓN JUGAR
   ========================================================= */

document
  .getElementById(
    'btnJugar'
  )
  .addEventListener(
    'click',
    () => {

      document
        .getElementById(
          'inicio'
        )
        .classList.add(
          'oculto'
        );


      inicializar();


      ultimoMs =
        performance.now();


      ultimoFrameMs =
        performance.now();
    }
  );


/* =========================================================
   INICIO
   ========================================================= */

ajustarCanvas();


ultimoMs =
  performance.now();


ultimoFrameMs =
  performance.now();


actualizarBarraProgreso();


requestAnimationFrame(
  bucle
);

</script>
