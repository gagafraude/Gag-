<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Come Caca</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #a9a9a9;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    touch-action: none;
  }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 16px;
    color: #222;
    z-index: 10;
    background: rgba(255,255,255,0.4);
  }

  #juego {
    display: block;
    width: 100vw;
    height: 100vh;
    touch-action: none;
  }

  /* ---------- D-PAD ---------- */
  #dpad {
    position: fixed;
    right: 16px;
    bottom: 24px;
    width: 170px;
    height: 170px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    grid-template-areas:
      ".  arriba  ."
      "izq .    der"
      ".  abajo   .";
    gap: 4px;
    z-index: 20;
  }

  .btn-dir {
    background: rgba(0,0,0,0.35);
    border: none;
    color: #fff;
    font-size: 22px;
    border-radius: 10px;
    touch-action: none;
    user-select: none;
  }

  .btn-dir:active { background: rgba(0,0,0,0.6); }
  .btn-dir[data-dir="arriba"]    { grid-area: arriba; }
  .btn-dir[data-dir="abajo"]     { grid-area: abajo; }
  .btn-dir[data-dir="izquierda"] { grid-area: izq; }
  .btn-dir[data-dir="derecha"]   { grid-area: der; }

  /* ---------- CONTADOR DE CACAS ---------- */
  #contadorCacas {
    display: inline-block;
    color: #222;
    font-size: 22px;
    font-weight: bold;
    line-height: 1;
  }

  /* ---------- OVERLAYS ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    z-index: 100;
  }

  .overlay.oculto { display: none; }

  .overlay img, .overlay video {
    flex: 1;
    width: 100%;
    object-fit: cover;
    min-height: 0;
  }

  #imgDerrota {
    object-fit: contain;
    background: #000;
  }

  #inicio img {
    object-fit: contain;
    background: #000;
  }

  #vidVictoria {
    object-fit: contain;
    background: #000;
  }

  .acciones {
    background: #111;
    padding: 12px;
    display: flex;
    justify-content: center;
  }

  .boton {
    padding: 14px 40px;
    font-size: 20px;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    background: #c0392b;
    color: #fff;
    cursor: pointer;
  }
</style>
</head>

<body>

  <div id="hud">
    <span id="contadorCacas">0</span>
  </div>

  <canvas id="juego"></canvas>

  <!-- Controles táctiles -->
  <div id="dpad">
    <button class="btn-dir" data-dir="arriba">▲</button>
    <button class="btn-dir" data-dir="izquierda">◀</button>
    <button class="btn-dir" data-dir="derecha">▶</button>
    <button class="btn-dir" data-dir="abajo">▼</button>
  </div>

  <!-- PANTALLA DE INICIO -->
  <div id="inicio" class="overlay">
    <img src="assets/inicio.png" alt="Come Caca">
    <div class="acciones">
      <button id="btnJugar" class="boton">JUGAR</button>
    </div>
  </div>

  <!-- Pantalla de derrota -->
  <div id="derrota" class="overlay oculto">
    <img id="imgDerrota" src="assets/derrota.png" alt="Perdiste">
    <div class="acciones">
      <button id="btnReiniciar" class="boton">REINICIAR</button>
    </div>
  </div>

  <!-- Pantalla de victoria -->
  <div id="victoria" class="overlay oculto">
    <video id="vidVictoria" src="assets/victoria.mp4" loop playsinline></video>
    <div class="acciones">
      <button id="btnSiguiente" class="boton">JUGAR OTRA VEZ</button>
    </div>
  </div>

<script>
// ============================================================
//  COME CACA — juego estilo Pac-Man vertical
// ============================================================

// ---------- CONFIGURACIÓN ----------
const COLS = 10;
const ROWS = 16;

const COLOR_FONDO = '#a9a9a9';
const COLOR_PARED = '#3a3a3a';

const VEL_JUGADOR = 1.5;
const VEL_ENEMIGO = 0.8;

const ESCALA_PERSONAJE = 2.5;
const MARGEN_PARED = 0;

const PROB_CACA      = 0.7;
const NUM_CARAS      = 4;
const CARAS_PARALIZA = 3000;
const ENEMIGOS_INI   = 4;
const ENEMIGOS_CADA  = 5000;
const VIDAS_INI      = 3;
const PUNTOS_CACA    = 10;

// Cada 6 cacas comidas aparece una imagen y su audio
const CACA_PARA_EVENTO = 5;

const CENTRO = { c1: 3, c2: 6, r1: 6, r2: 9 };
const ASPECTO_CENTRO = 1920 / 1080;

// ---------- CANVAS ----------
const canvas = document.getElementById('juego');
const ctx = canvas.getContext('2d');

let CELL = 0, OFFSET_X = 0, OFFSET_Y = 0;

function ajustarCanvas() {
  const w = window.innerWidth;
  const h = window.innerHeight - 40;

  canvas.width  = w;
  canvas.height = h;

  const cellW = w / COLS;
  const cellH = h / ROWS;

  CELL = Math.floor(Math.min(cellW, cellH));

  OFFSET_X = Math.floor((w - CELL * COLS) / 2);
  OFFSET_Y = Math.floor((h - CELL * ROWS) / 2) + 20;
}

window.addEventListener('resize', ajustarCanvas);

// ---------- RECURSOS ----------
const imgJugador = new Image();
imgJugador.src = 'assets/jugador.png';

const imgFantasmaDerecha = new Image();
imgFantasmaDerecha.src = 'assets/fantasmaderecha.png';

const imgFantasmaFrente = new Image();
imgFantasmaFrente.src = 'assets/fantasmafrente.png';

const imgFantasmaIzquierda = new Image();
imgFantasmaIzquierda.src = 'assets/fantasmaizquierda.png';

const imgFantasmaCentro = new Image();
imgFantasmaCentro.src = 'assets/fantasmafrente.png';

const FANTASMA_FRAMES = 16;
const FANTASMA_COLUMNAS = 4;
const FANTASMA_FILAS = 4;

const imgCaca = new Image();
imgCaca.src = 'assets/caca.png';

const imgCara = new Image();
imgCara.src = 'assets/cara.png';

// ---------- BILLETE VOLADOR (sprite sheet 4x4 = 16 frames) ----------
const imgBillete = new Image();
imgBillete.src = 'assets/billete.png';
const BILLETE_DURACION_MS = 2000;
const BILLETE_FRAMES = 16;
const BILLETE_LOOPS = 6;
const BILLETE_COLUMNAS = 4;
const BILLETE_FILAS = 4;
const BILLETE_ANCHO = 130;
const BILLETE_ALTO = BILLETE_ANCHO * (410 / 360);
const billetesVolando = [];

function lanzarBillete() {
  const audio = new Audio('assets/billete.mp3');
  audio.volume = 1.0;
  audio.preload = 'auto';

  const billete = {
    inicio: performance.now(),
    duracion: BILLETE_DURACION_MS,
    audio,
    frame: 0
  };

  billetesVolando.push(billete);

  audio.currentTime = 0;
  audio.play().catch(() => {});
}

function actualizarBilletes(ahora) {
  for (let i = billetesVolando.length - 1; i >= 0; i--) {
    const b = billetesVolando[i];
    const progreso = Math.min(
      1,
      Math.max(0, (ahora - b.inicio) / b.duracion)
    );

    // 32 cuadros en total: el sprite sheet de 16 cuadros se reproduce 2 veces
    // durante los 2 segundos completos del vuelo.
    const totalFrames = BILLETE_FRAMES * BILLETE_LOOPS;
    const frameTotal = Math.min(
      totalFrames - 1,
      Math.floor(progreso * totalFrames)
    );
    b.frame = frameTotal % BILLETE_FRAMES;

    if (progreso >= 1) {
      b.audio.pause();
      b.audio.currentTime = 0;
      billetesVolando.splice(i, 1);
    }
  }
}

function dibujarBilletes() {
  if (!imgBillete.complete || imgBillete.naturalWidth <= 0) return;

  const sw = imgBillete.width / BILLETE_COLUMNAS;
  const sh = imgBillete.height / BILLETE_FILAS;

  for (const b of billetesVolando) {
    const progreso = Math.min(
      1,
      Math.max(0, (performance.now() - b.inicio) / b.duracion)
    );

    // De esquina inferior izquierda a esquina superior derecha.
    const inicioX = -BILLETE_ANCHO / 2;
    const inicioY = canvas.height + BILLETE_ALTO / 2;
    const finalX = canvas.width + BILLETE_ANCHO / 2;
    const finalY = -BILLETE_ALTO / 2;

    const x = inicioX + (finalX - inicioX) * progreso;
    const y = inicioY + (finalY - inicioY) * progreso;

    const columna = b.frame % BILLETE_COLUMNAS;
    const fila = Math.floor(b.frame / BILLETE_COLUMNAS);
    const sx = columna * sw;
    const sy = fila * sh;

    ctx.drawImage(
      imgBillete,
      sx, sy, sw, sh,
      x - BILLETE_ANCHO / 2,
      y - BILLETE_ALTO / 2,
      BILLETE_ANCHO,
      BILLETE_ALTO
    );
  }
}

const audioMusica = new Audio('assets/musica.mp3');
audioMusica.loop = true;
audioMusica.volume = 0.4;

const audioComer = new Audio('assets/comer.mp3');
audioComer.volume = 0.7;

const audioCaja = new Audio('assets/caja.mp3');
audioCaja.volume = 0.7;

const audiosPedo = [];

for (let i = 1; i <= 10; i++) {
  const a = new Audio(`assets/pedo${i}.mp3`);
  a.volume = 0.5;
  audiosPedo.push(a);
}

let ultimoPedoMs = 0;

function reproducirPedo() {
  const ahora = performance.now();

  if (ahora - ultimoPedoMs < 180) return;

  ultimoPedoMs = ahora;

  const a = audiosPedo[Math.floor(Math.random() * audiosPedo.length)];

  try {
    a.currentTime = 0;
    a.play();
  } catch(e) {}
}

const audioMuerte = new Audio('assets/muerte.mp3');
audioMuerte.volume = 0.7;

const audioPedoLargo = new Audio('assets/pedo-largo.mp3');
audioPedoLargo.volume = 0.7;

// ---------- AUDIO DE DERROTA ----------
const audioDerrota = new Audio('assets/derrotatobias.mp3');
audioDerrota.volume = 1.0;
audioDerrota.preload = 'auto';

// ---------- VIDEO CENTRAL ----------
const videoCentro = document.createElement('video');
videoCentro.src = 'assets/centro.mp4';
videoCentro.loop = true;
videoCentro.muted = true;
videoCentro.playsInline = true;
videoCentro.autoplay = true;
videoCentro.play().catch(()=>{});

// ============================================================
//  NUEVO: 18 AUDIOS + 18 IMÁGENES
// ============================================================

const eventosCaca = [
  {
    audio: 'assets/1-arielbernatene.mp3',
    imagen: 'assets/1-arielbernatene.png'
  },
  {
    audio: 'assets/2-silvanacalicchia.mp3',
    imagen: 'assets/2-silvanacalicchia.png'
  },
  {
    audio: 'assets/3-piavivet.mp3',
    imagen: 'assets/3-piavivet.png'
  },
  {
    audio: 'assets/4-gastonsantamaria.mp3',
    imagen: 'assets/4-gastonsantamaria.png'
  },
  {
    audio: 'assets/5-carinaflores.mp3',
    imagen: 'assets/5-carinaflores.png'
  },
  {
    audio: 'assets/6-ivanavescovi.mp3',
    imagen: 'assets/6-ivanavescovi.png'
  },
  {
    audio: 'assets/7-claudiagalera.mp3',
    imagen: 'assets/7-claudiagalera.png'
  },
  {
    audio: 'assets/8-micaelaarias.mp3',
    imagen: 'assets/8-micaelaarias.png'
  },
  {
    audio: 'assets/9-walterocana.mp3',
    imagen: 'assets/9-walterocana.png'
  },
  {
    audio: 'assets/10-cintialemarchand.mp3',
    imagen: 'assets/10-cintialemarchand.png'
  },
  {
    audio: 'assets/11-yonatanjara.mp3',
    imagen: 'assets/11-yonatanjara.png'
  },
  {
    audio: 'assets/12-kiara.mp3',
    imagen: 'assets/12-kiara.png'
  },
  {
    audio: 'assets/13-sergionova.mp3',
    imagen: 'assets/13-sergionova.png'
  },
  {
    audio: 'assets/14-fabianpoblete.mp3',
    imagen: 'assets/14-fabianpoblete.png'
  },
  {
    audio: 'assets/18-albano.mp3',
    imagen: 'assets/18-albano.png'
  }
];

// Pre-cargar las imágenes
eventosCaca.forEach(evento => {
  evento.img = new Image();
  evento.img.src = evento.imagen;
});

// Pre-cargar los audios
eventosCaca.forEach(evento => {
  evento.audioObj = new Audio(evento.audio);
  evento.audioObj.preload = 'auto';
  evento.audioObj.volume = 1.0;
});

// Imagen actualmente mostrada en el centro
let eventoCentroActivo = null;

// Audio actualmente reproducido
let audioEventoActivo = null;

// Bolsa aleatoria: cada evento aparece una sola vez antes de
// volver a habilitar todos los eventos.
let eventosDisponibles = [];
let ultimoEvento = -1;

function mezclarEventos() {
  eventosDisponibles = eventosCaca.map((_, indice) => indice);

  // Fisher-Yates
  for (let i = eventosDisponibles.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [eventosDisponibles[i], eventosDisponibles[j]] =
      [eventosDisponibles[j], eventosDisponibles[i]];
  }

  // Si estamos empezando una nueva vuelta y hay más de un evento,
  // evitamos que el primero sea igual al último de la vuelta anterior.
  if (eventosDisponibles.length > 1 &&
      eventosDisponibles[0] === ultimoEvento) {
    const j = 1 + Math.floor(Math.random() * (eventosDisponibles.length - 1));
    [eventosDisponibles[0], eventosDisponibles[j]] =
      [eventosDisponibles[j], eventosDisponibles[0]];
  }
}

// ---------- ESTADO ----------
let jugador, enemigos, cacas, caras, puntos, vidas, paralizadoHasta, ultimoEnemigo, juegoActivo;

let cacasComidasDesdeEvento = 0;

function actualizarContadorCacas() {
  const el = document.getElementById("contadorCacas");
  if (el) el.textContent = cacasComidasDesdeEvento;
}

let frameJugador = 0;
let frameEnemigo = 0;

let ultimoFrameMs = 0;
let ultimoMs = 0;
let pasoAcumulado = 0;

// ---------- UTILIDADES ----------
function esCentro(col, fila) {
  return col >= CENTRO.c1 &&
         col <= CENTRO.c2 &&
         fila >= CENTRO.r1 &&
         fila <= CENTRO.r2;
}

function esBorde(col, fila) {
  return col === 0 ||
         col === COLS - 1 ||
         fila === 0 ||
         fila === ROWS - 1;
}

function esBloque(col, fila) {
  return esBorde(col, fila) || esCentro(col, fila);
}

function celdaLibre(col, fila) {
  return !esBloque(col, fila);
}

function centroCelda(col, fila) {
  return {
    x: OFFSET_X + (col + 0.5) * CELL,
    y: OFFSET_Y + (fila + 0.5) * CELL
  };
}

function celdaDePixel(px, py) {
  return {
    col: Math.floor((px - OFFSET_X) / CELL),
    fila: Math.floor((py - OFFSET_Y) / CELL)
  };
}

function rectCentro() {
  const zonaX = OFFSET_X + CENTRO.c1 * CELL;
  const zonaY = OFFSET_Y + CENTRO.r1 * CELL;

  const zonaW = (CENTRO.c2 - CENTRO.c1 + 1) * CELL;
  const zonaH = (CENTRO.r2 - CENTRO.r1 + 1) * CELL;

  let w = zonaW;
  let h = w / ASPECTO_CENTRO;

  if (h > zonaH) {
    h = zonaH;
    w = h * ASPECTO_CENTRO;
  }

  const x = zonaX + (zonaW - w) / 2;
  const y = zonaY + (zonaH - h) / 2;

  return { x, y, w, h };
}

// ============================================================
//  NUEVO: MOSTRAR EVENTO DE LAS 6 CACAS
// ============================================================

function mostrarEventoCaca() {

  if (!eventosCaca.length) return;

  // Cuando se agotó la bolsa, se vuelve a mezclar completa.
  // Así no se repite ningún evento hasta haber mostrado todos.
  if (!eventosDisponibles.length) {
    mezclarEventos();
  }

  const indice = eventosDisponibles.pop();
  ultimoEvento = indice;

  const evento = eventosCaca[indice];

  eventoCentroActivo = evento;

  // Detener el audio anterior, si hubiera alguno
  if (audioEventoActivo) {
    audioEventoActivo.pause();
    audioEventoActivo.currentTime = 0;
  }

  audioEventoActivo = evento.audioObj;

  // El video central deja de verse mientras aparece la imagen
  videoCentro.pause();

  // Reiniciar y reproducir el audio correspondiente
  audioEventoActivo.currentTime = 0;

  audioEventoActivo.play().catch(() => {});

  // Cuando termina el audio, vuelve el video central
  audioEventoActivo.onended = () => {

    if (audioEventoActivo === evento.audioObj) {

      eventoCentroActivo = null;

      videoCentro.currentTime =
        videoCentro.currentTime;

      videoCentro.play().catch(() => {});
    }
  };
}

// ---------- INICIALIZACIÓN ----------
function inicializar() {
  ajustarCanvas();

  const p0 = centroCelda(
    Math.floor(COLS / 2),
    ROWS - 3
  );

  jugador = {
    x: p0.x,
    y: p0.y,
    dir: 'arriba',
    vel: VEL_JUGADOR,
    vivo: true
  };

  cacas = [];

  for (let f = 0; f < ROWS; f++) {
    for (let c = 0; c < COLS; c++) {

      if (!celdaLibre(c, f)) continue;

      if (
        c === Math.floor(COLS / 2) &&
        f === ROWS - 3
      ) continue;

      if (Math.random() < PROB_CACA) {
        const p = centroCelda(c, f);

        cacas.push({
          x: p.x,
          y: p.y,
          comida: false
        });
      }
    }
  }

  caras = [];

  let intentos = 0;

  while (caras.length < NUM_CARAS && intentos < 500) {

    intentos++;

    const c = 1 + Math.floor(Math.random() * (COLS - 2));
    const f = 1 + Math.floor(Math.random() * (ROWS - 2));

    if (!celdaLibre(c, f)) continue;

    const p = centroCelda(c, f);

    if (
      Math.hypot(
        p.x - jugador.x,
        p.y - jugador.y
      ) < CELL * 3
    ) continue;

    if (
      caras.some(ca =>
        Math.hypot(
          ca.x - p.x,
          ca.y - p.y
        ) < CELL * 2
      )
    ) continue;

    caras.push({
      x: p.x,
      y: p.y,
      recogida: false
    });
  }

  enemigos = [];

  const esquinas = [
    centroCelda(1, 1),
    centroCelda(COLS - 2, 1),
    centroCelda(1, ROWS - 2),
    centroCelda(COLS - 2, ROWS - 2)
  ];

  for (let i = 0; i < ENEMIGOS_INI; i++) {

    enemigos.push({
      x: esquinas[i].x,
      y: esquinas[i].y,
      dir: 'abajo',
      vel: VEL_ENEMIGO
    });
  }

  puntos = 0;
  vidas = VIDAS_INI;
  paralizadoHasta = 0;
  ultimoEnemigo = performance.now();
  juegoActivo = true;
  pasoAcumulado = 0;

  // Reiniciar contador de cacas para el evento
  cacasComidasDesdeEvento = 0;

  // Nueva bolsa aleatoria para esta partida. Cada foto/audio
  // aparecerá una sola vez antes de volver a mezclarse.
  ultimoEvento = -1;
  eventosDisponibles = [];
  mezclarEventos();

  // Limpiar billetes de una partida anterior
  for (const b of billetesVolando) {
    b.audio.pause();
    b.audio.currentTime = 0;
  }
  billetesVolando.length = 0;

  // Detener evento anterior
  eventoCentroActivo = null;

  if (audioEventoActivo) {
    audioEventoActivo.pause();
    audioEventoActivo.currentTime = 0;
    audioEventoActivo = null;
  }

  videoCentro.currentTime = 0;
  videoCentro.play().catch(()=>{});

  document.getElementById('derrota').classList.add('oculto');
  document.getElementById('victoria').classList.add('oculto');

  // Detener cualquier audio de derrota anterior
  audioDerrota.pause();
  audioDerrota.currentTime = 0;

  audioMusica.currentTime = 0;
  audioMusica.play().catch(() => {});
}

// ---------- APARICIÓN DE ENEMIGOS ----------
function agregarEnemigoAleatorio() {

  const candidatos = [];

  for (let c = 1; c < COLS - 1; c++) {
    for (let f = 1; f < ROWS - 1; f++) {
      if (celdaLibre(c, f)) {
        candidatos.push({ c, f });
      }
    }
  }

  if (!candidatos.length) return;

  const e =
    candidatos[
      Math.floor(Math.random() * candidatos.length)
    ];

  const p = centroCelda(e.c, e.f);

  enemigos.push({
    x: p.x,
    y: p.y,
    dir: 'abajo',
    vel: VEL_ENEMIGO
  });
}

// ---------- INPUT ----------
function activarAudioUsuario() {
  if (audioMusica.paused && juegoActivo) {
    audioMusica.play().catch(()=>{});
  }
}

document.querySelectorAll('.btn-dir').forEach(btn => {

  const dir = btn.dataset.dir;

  const activar = (ev) => {

    ev.preventDefault();

    activarAudioUsuario();

    if (jugador) {
      jugador.dir = dir;
    }
  };

  btn.addEventListener(
    'touchstart',
    activar,
    { passive: false }
  );

  btn.addEventListener(
    'mousedown',
    activar
  );
});

window.addEventListener('keydown', e => {

  activarAudioUsuario();

  if (!jugador) return;

  if (e.key === 'ArrowUp')
    jugador.dir = 'arriba';

  if (e.key === 'ArrowDown')
    jugador.dir = 'abajo';

  if (e.key === 'ArrowLeft')
    jugador.dir = 'izquierda';

  if (e.key === 'ArrowRight')
    jugador.dir = 'derecha';
});

// ---------- MOVIMIENTO ----------
function moverEntidad(ent, dt) {

  const dx =
    (ent.dir === 'derecha'
      ? 1
      : ent.dir === 'izquierda'
      ? -1
      : 0) *
    ent.vel *
    dt;

  const dy =
    (ent.dir === 'abajo'
      ? 1
      : ent.dir === 'arriba'
      ? -1
      : 0) *
    ent.vel *
    dt;

  let movido = 0;

  if (dx !== 0) {

    const nuevaX = ent.x + dx;

    const celda = celdaDePixel(
      nuevaX + Math.sign(dx) * CELL * MARGEN_PARED,
      ent.y
    );

    if (celdaLibre(celda.col, celda.fila)) {

      ent.x = nuevaX;
      movido += Math.abs(dx);

    } else {

      const al = celdaDePixel(ent.x, ent.y);

      ent.x =
        centroCelda(
          al.col,
          al.fila
        ).x;
    }
  }

  if (dy !== 0) {

    const nuevaY = ent.y + dy;

    const celda = celdaDePixel(
      ent.x,
      nuevaY + Math.sign(dy) * CELL * MARGEN_PARED
    );

    if (celdaLibre(celda.col, celda.fila)) {

      ent.y = nuevaY;
      movido += Math.abs(dy);

    } else {

      const al = celdaDePixel(ent.x, ent.y);

      ent.y =
        centroCelda(
          al.col,
          al.fila
        ).y;
    }
  }

  return movido;
}

// ---------- IA ----------
function moverEnemigoIA(en, dt) {

  const celda = celdaDePixel(en.x, en.y);

  const cx =
    centroCelda(celda.col, celda.fila).x;

  const cy =
    centroCelda(celda.col, celda.fila).y;

  const alX = Math.abs(en.x - cx) < 2;
  const alY = Math.abs(en.y - cy) < 2;

  if (alX && alY) {

    const dx = jugador.x - en.x;
    const dy = jugador.y - en.y;

    const opciones = [];

    if (Math.abs(dx) > Math.abs(dy)) {

      opciones.push(
        dx > 0 ? 'derecha' : 'izquierda'
      );

      opciones.push(
        dy > 0 ? 'abajo' : 'arriba'
      );

    } else {

      opciones.push(
        dy > 0 ? 'abajo' : 'arriba'
      );

      opciones.push(
        dx > 0 ? 'derecha' : 'izquierda'
      );
    }

    const deltas = {
      arriba: [0, -1],
      abajo: [0, 1],
      izquierda: [-1, 0],
      derecha: [1, 0]
    };

    for (const dir of opciones) {

      const d = deltas[dir];

      if (
        celdaLibre(
          celda.col + d[0],
          celda.fila + d[1]
        )
      ) {
        en.dir = dir;
        break;
      }
    }
  }

  moverEntidad(en, dt);
}

// ---------- UPDATE ----------
function actualizar(dt, ahora) {

  if (!juegoActivo) return;

  const movido =
    moverEntidad(jugador, dt);

  pasoAcumulado += movido;

  if (pasoAcumulado >= CELL * 0.5) {

    pasoAcumulado = 0;

    reproducirPedo();
  }

  if (
    ahora - ultimoEnemigo >= ENEMIGOS_CADA
  ) {

    ultimoEnemigo = ahora;

    agregarEnemigoAleatorio();
  }

  for (const c of cacas) {

    if (c.comida) continue;

    if (
      Math.hypot(
        c.x - jugador.x,
        c.y - jugador.y
      ) < CELL * 0.7
    ) {

      c.comida = true;

      puntos += PUNTOS_CACA;

      // Contar las cacas comidas
      cacasComidasDesdeEvento++;
      actualizarContadorCacas();

      try {
        audioComer.currentTime = 0;
        audioComer.play();
      } catch(e) {}

      // Cada 6 cacas:
      // elegir aleatoriamente un audio + imagen
      if (
        cacasComidasDesdeEvento >= CACA_PARA_EVENTO
      ) {

        cacasComidasDesdeEvento = 0;

        mostrarEventoCaca();
        lanzarBillete();
      }
    }
  }

  for (const c of caras) {

    if (c.recogida) continue;

    if (
      Math.hypot(
        c.x - jugador.x,
        c.y - jugador.y
      ) < CELL * 0.7
    ) {

      c.recogida = true;

      paralizadoHasta =
        ahora + CARAS_PARALIZA;

      try {
        audioCaja.currentTime = 0;
        audioCaja.play();
      } catch(e) {}
    }
  }

  const paralizado =
    ahora < paralizadoHasta;

  if (!paralizado) {
    for (const en of enemigos) {
      moverEnemigoIA(en, dt);
    }
  }

  for (const en of enemigos) {

    if (
      Math.hypot(
        en.x - jugador.x,
        en.y - jugador.y
      ) < CELL * 0.8
    ) {

      perderVida();

      return;
    }
  }

  if (cacas.every(c => c.comida)) {
    ganar();
  }
}

function perderVida() {

  vidas--;

  try {
    audioMuerte.currentTime = 0;
    audioMuerte.play();
  } catch(e) {}

  if (vidas <= 0) {

    juegoActivo = false;

    audioMusica.pause();

    // Detener evento central si estaba reproduciéndose
    eventoCentroActivo = null;

    if (audioEventoActivo) {
      audioEventoActivo.pause();
      audioEventoActivo.currentTime = 0;
      audioEventoActivo = null;
    }

    videoCentro.play().catch(()=>{});

    try {
      audioPedoLargo.currentTime = 0;
      audioPedoLargo.play();
    } catch(e) {}

    audioDerrota.currentTime = 0;
    audioDerrota.play().catch(() => {});

    document
      .getElementById('derrota')
      .classList.remove('oculto');

    return;
  }

  const p =
    centroCelda(
      Math.floor(COLS / 2),
      ROWS - 3
    );

  jugador.x = p.x;
  jugador.y = p.y;
  jugador.dir = 'arriba';
}

function ganar() {

  juegoActivo = false;

  audioMusica.pause();
  audioMusica.currentTime = 0;

  audioMuerte.pause();
  audioMuerte.currentTime = 0;

  audioPedoLargo.pause();
  audioPedoLargo.currentTime = 0;

  audioCaja.pause();
  audioCaja.currentTime = 0;

  // Detener evento central
  eventoCentroActivo = null;

  if (audioEventoActivo) {
    audioEventoActivo.pause();
    audioEventoActivo.currentTime = 0;
    audioEventoActivo = null;
  }

  videoCentro.play().catch(()=>{});

  // Detener sonido de derrota por seguridad
  audioDerrota.pause();
  audioDerrota.currentTime = 0;

  const vid =
    document.getElementById('vidVictoria');

  document
    .getElementById('victoria')
    .classList.remove('oculto');

  vid.currentTime = 0;
  vid.volume = 1.0;
  vid.muted = false;

  vid.play().catch(err => {

    vid.muted = true;

    vid.play().catch(()=>{});
  });
}

// ---------- RENDER ----------
const FILA_DIR = {
  arriba: 0,
  derecha: 1,
  abajo: 2,
  izquierda: 3
};

function obtenerSpriteFantasma(dir) {
  switch (dir) {
    case 'derecha':
      return imgFantasmaDerecha;
    case 'izquierda':
      return imgFantasmaIzquierda;
    case 'arriba':
    case 'abajo':
      return imgFantasmaCentro;
    default:
      return imgFantasmaCentro;
  }
}

function dibujarSpriteFantasma(img, ent, frame, tamano = CELL) {
  const sw = img.width / FANTASMA_COLUMNAS;
  const sh = img.height / FANTASMA_FILAS;
  const frameSeguro = ((frame % FANTASMA_FRAMES) + FANTASMA_FRAMES) % FANTASMA_FRAMES;
  const columna = frameSeguro % FANTASMA_COLUMNAS;
  const fila = Math.floor(frameSeguro / FANTASMA_COLUMNAS);
  const sx = columna * sw;
  const sy = fila * sh;

  ctx.drawImage(img, sx, sy, sw, sh, ent.x - tamano / 2, ent.y - tamano / 2, tamano, tamano);
}

function dibujarSprite(
  img,
  ent,
  dir,
  frame,
  tamano = CELL
) {

  const filaDir =
    FILA_DIR[dir] ?? 2;

  const sw = img.width / 4;
  const sh = img.height / 4;

  const sx = frame * sw;
  const sy = filaDir * sh;

  ctx.drawImage(
    img,
    sx,
    sy,
    sw,
    sh,
    ent.x - tamano / 2,
    ent.y - tamano / 2,
    tamano,
    tamano
  );
}

function dibujar(ahora) {

  ctx.fillStyle = COLOR_FONDO;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  if (!jugador) return;

  ctx.strokeStyle = COLOR_PARED;
  ctx.lineWidth = Math.max(4, CELL * 0.15);

  ctx.strokeRect(
    OFFSET_X,
    OFFSET_Y,
    CELL * COLS,
    CELL * ROWS
  );

  const rect = rectCentro();

  // ==========================================================
  //  CENTRO: VIDEO O IMAGEN DEL EVENTO
  // ==========================================================

  if (
    eventoCentroActivo &&
    eventoCentroActivo.img.complete &&
    eventoCentroActivo.img.naturalWidth > 0
  ) {

    // Mostrar la imagen correspondiente al audio
    ctx.drawImage(
      eventoCentroActivo.img,
      rect.x,
      rect.y,
      rect.w,
      rect.h
    );

  } else if (videoCentro.readyState >= 2) {

    // Video central normal
    ctx.drawImage(
      videoCentro,
      rect.x,
      rect.y,
      rect.w,
      rect.h
    );

  } else {

    ctx.fillStyle = COLOR_PARED;

    ctx.fillRect(
      rect.x,
      rect.y,
      rect.w,
      rect.h
    );
  }

  // ---------- CACAS ----------
  for (const c of cacas) {

    if (c.comida) continue;

    const s = CELL * 0.9;

    if (
      imgCaca.complete &&
      imgCaca.naturalWidth > 0
    ) {

      ctx.drawImage(
        imgCaca,
        c.x - s / 2,
        c.y - s / 2,
        s,
        s
      );

    } else {

      ctx.fillStyle = '#6b3e1e';

      ctx.beginPath();

      ctx.arc(
        c.x,
        c.y,
        s / 2,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }

  // ---------- CARAS ----------
  for (const c of caras) {

    if (c.recogida) continue;

    const s = CELL * 1.5;

    if (
      imgCara.complete &&
      imgCara.naturalWidth > 0
    ) {

      ctx.drawImage(
        imgCara,
        c.x - s / 2,
        c.y - s / 2,
        s,
        s
      );

    } else {

      ctx.fillStyle = '#f1c40f';

      ctx.beginPath();

      ctx.arc(
        c.x,
        c.y,
        s / 2,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }

  // ---------- ENEMIGOS ----------
  const tamPersonaje =
    CELL * ESCALA_PERSONAJE;

  const paralizado =
    ahora < paralizadoHasta;

  for (const en of enemigos) {

    const imgFantasma = obtenerSpriteFantasma(en.dir);

    if (
      imgFantasma.complete &&
      imgFantasma.naturalWidth > 0
    ) {

      dibujarSpriteFantasma(
        imgFantasma,
        en,
        frameEnemigo,
        tamPersonaje
      );

    } else {

      ctx.fillStyle =
        paralizado
          ? '#3498db'
          : '#c0392b';

      ctx.beginPath();

      ctx.arc(
        en.x,
        en.y,
        tamPersonaje * 0.4,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }

    if (paralizado) {

      ctx.fillStyle =
        'rgba(60,120,255,0.5)';

      ctx.beginPath();

      ctx.arc(
        en.x,
        en.y,
        tamPersonaje * 0.45,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }

  // ---------- JUGADOR ----------
  if (jugador.vivo) {

    if (
      imgJugador.complete &&
      imgJugador.naturalWidth > 0
    ) {

      dibujarSprite(
        imgJugador,
        jugador,
        jugador.dir,
        frameJugador,
        tamPersonaje
      );

    } else {

      ctx.fillStyle = '#f39c12';

      ctx.beginPath();

      ctx.arc(
        jugador.x,
        jugador.y,
        tamPersonaje * 0.4,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }
  }

  // ---------- BILLETES VOLANDO ----------
  // Se dibujan al final para que queden por encima del juego.
  dibujarBilletes();
}

// ---------- BUCLE ----------
function bucle(ahora) {

  const dtSeg =
    Math.min(
      (ahora - ultimoMs) / 1000,
      0.05
    );

  ultimoMs = ahora;

  const dt = dtSeg * 60;

  if (
    ahora - ultimoFrameMs > 120
  ) {

    frameJugador =
      (frameJugador + 1) % 4;

    frameEnemigo =
      (frameEnemigo + 1) % FANTASMA_FRAMES;

    ultimoFrameMs = ahora;
  }

  actualizar(dt, ahora);
  actualizarBilletes(ahora);
  dibujar(ahora);

  requestAnimationFrame(bucle);
}
